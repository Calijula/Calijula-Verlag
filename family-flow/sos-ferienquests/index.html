<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Ferien-Quests – Schluss mit Langeweile | Calijula Verlag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #22364B; --navy-deep: #172736;
    --sage: #7C9473; --sage-deep: #5C7452; --sage-hero: #445A3C;
    --terracotta: #D97052; --terracotta-deep: #B85639;
    --sand: #F6F1E6; --sand-card: #EFE6D4; --cream: #FBF8F1; --ink: #2B2822;
    /* Quest-Karten-Palette, 1:1 an das Buch-Layout angelehnt */
    --q-green: #2E9E52; --q-green-deep: #1F7A3C; --q-green-light: #D9EFD7;
    --q-gray: #9BA1A6; --q-gray-deep: #767C81; --q-gray-light: #ECEDEE;
    --q-blue-light: #C3E3EE; --q-blue-deep: #1F3A56;
    --q-red: #D9534F; --q-gold: #F5C518; --q-gold-ink: #4A3800;
    --q-yellow-light: #FBF3D3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Work Sans', sans-serif; color:var(--ink); background:var(--sand); -webkit-font-smoothing:antialiased;}
  .cal{font-family:'Dancing Script', cursive; font-weight:700;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 28px;}
  a:focus-visible, button:focus-visible, summary:focus-visible{outline:2px solid var(--sage-deep); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  section[id]{scroll-margin-top:80px;}

  header{position:sticky; top:0; z-index:50; background:rgba(251,248,241,0.92); backdrop-filter:blur(6px); border-bottom:1px solid rgba(34,54,75,0.08);}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:18px 28px; max-width:1000px; margin:0 auto;}
  .brandmark{display:flex; align-items:center; gap:12px;}
  .logo-script{font-family:'Dancing Script', cursive; font-weight:700; font-size:30px; line-height:1; color:var(--navy); position:relative; top:2px;}
  .logo-sub{font-size:11px; letter-spacing:0.18em; text-transform:uppercase; font-weight:600; color:var(--terracotta-deep); position:relative; top:3px;}
  .breadcrumb{font-size:13.5px; font-weight:500; color:var(--navy); display:none;}
  @media (min-width:640px){ .breadcrumb{display:inline-flex; align-items:center; gap:6px;} }

  .hero{background:var(--navy-deep); color:var(--cream); padding:76px 28px 88px; text-align:center; position:relative; overflow:hidden;}
  .hero::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 18% 15%, rgba(46,158,82,0.22), transparent 45%), radial-gradient(circle at 85% 80%, rgba(46,158,82,0.14), transparent 50%); pointer-events:none;}
  .hero-inner{position:relative; max-width:700px; margin:0 auto;}
  .badge{position:relative; display:inline-block; font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase; font-weight:800; padding:8px 18px 8px 16px; background:var(--q-green); color:#fff; margin-bottom:28px; clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,4% 50%); transform:rotate(-1.5deg); box-shadow:0 4px 12px rgba(46,158,82,0.35);}
  .hero h1{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(34px,5.5vw,52px); line-height:1.1; margin-bottom:20px;}
  .hero p{font-size:17px; line-height:1.65; color:rgba(251,248,241,0.85); max-width:560px; margin:0 auto 12px;}
  .hero .small{font-size:13.5px; color:rgba(251,248,241,0.6); margin-bottom:28px;}

  .morse-row{display:flex; align-items:center; justify-content:center; gap:6px; margin:18px 0 14px; position:relative; height:16px;}
  .ms{opacity:0.25; background:var(--q-gold); animation:msBlip 4s infinite;}
  .ms.dot{width:8px; height:8px; border-radius:50%;}
  .ms.dash{width:22px; height:8px; border-radius:3px;}
  .ms:nth-child(1){animation-delay:0s;}
  .ms:nth-child(2){animation-delay:.28s;}
  .ms:nth-child(3){animation-delay:.56s;}
  .ms:nth-child(4){animation-delay:.96s;}
  .ms:nth-child(5){animation-delay:1.24s;}
  .ms:nth-child(6){animation-delay:1.52s;}
  .ms:nth-child(7){animation-delay:1.92s;}
  .ms:nth-child(8){animation-delay:2.2s;}
  .ms:nth-child(9){animation-delay:2.48s;}
  @keyframes msBlip{0%{opacity:.25;} 6%{opacity:1;} 16%{opacity:.25;} 100%{opacity:.25;}}
  .xp-pop{position:absolute; left:50%; top:-30px; transform:translateX(-50%) translateY(6px); font-size:12px; font-weight:800; color:var(--q-gold-ink); background:var(--q-gold); padding:5px 12px; border-radius:8px; white-space:nowrap; opacity:0; animation:xpPop 4s infinite;}
  @keyframes xpPop{
    0%,68%{opacity:0; transform:translateX(-50%) translateY(6px);}
    76%{opacity:1; transform:translateX(-50%) translateY(-4px);}
    90%{opacity:1; transform:translateX(-50%) translateY(-4px);}
    100%{opacity:0; transform:translateX(-50%) translateY(6px);}
  }
  @media (prefers-reduced-motion: reduce){ .ms{opacity:1 !important;} .xp-pop{display:none;} }

  .sos-letter{display:inline-block; color:var(--cream); animation:letterGlow 4s infinite;}
  .sl-a{animation-delay:0s;}
  .sl-b{animation-delay:.96s;}
  .sl-c{animation-delay:1.92s;}
  @keyframes letterGlow{
    0%{color:var(--cream);}
    5%{color:var(--q-gold);}
    28%{color:var(--q-gold);}
    34%{color:var(--cream);}
    100%{color:var(--cream);}
  }
  @media (prefers-reduced-motion: reduce){ .sos-letter{animation:none; color:var(--cream);} }
  .hero-ctas{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .btn{display:inline-block; padding:13px 26px; border-radius:6px; font-size:14.5px; font-weight:700; transition:transform .2s ease, box-shadow .2s ease;}
  .btn-primary{background:var(--q-green); color:#fff;}
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(46,158,82,0.4);}
  .wave{display:block; width:100%; position:absolute; bottom:-1px; left:0;}

  .painpoints{padding:64px 0 20px;}
  .section-label{font-size:13px; letter-spacing:0.14em; text-transform:uppercase; font-weight:600; color:var(--terracotta-deep); text-align:center; margin-bottom:8px;}
  .section-title{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(24px,3.4vw,32px); color:var(--navy); text-align:center; margin-bottom:40px; max-width:600px; margin-left:auto; margin-right:auto;}
  .pp-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:640px){ .pp-grid{grid-template-columns:1fr;} }
  .pp{background:var(--cream); border:1px solid rgba(34,54,75,0.08); border-radius:10px; padding:22px 24px; display:flex; gap:16px; align-items:flex-start; transition:transform .25s ease;}
  .pp:hover{transform:translateY(-2px) rotate(-0.4deg);}
  .pp .emoji{font-size:24px;}
  .pp p{font-size:15px; line-height:1.55; color:#4A4640;}
  .pp p strong{color:var(--navy);}
  .pp-note{text-align:center; font-family:'Fraunces', serif; font-style:italic; font-size:17px; color:var(--sage-deep); margin-top:32px;}

  .origin{padding:64px 0;}
  .origin-inner{max-width:680px; margin:0 auto;}
  .origin h2{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(24px,3.4vw,30px); color:var(--navy); margin-bottom:20px; text-align:center;}
  .origin p{font-size:16px; line-height:1.75; color:#4A4640; margin-bottom:16px;}
  .origin .tag{text-align:center; font-size:13.5px; letter-spacing:0.06em; color:var(--sage-deep); font-weight:600; margin-top:8px;}

  .steps{padding:64px 0;}
  .steps-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  @media (max-width:760px){ .steps-grid{grid-template-columns:1fr;} }
  .step{background:var(--sand-card); border-radius:8px; padding:28px 24px;}
  .step .snum{font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--cream); background:var(--terracotta); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .step h3{font-family:'Fraunces', serif; font-weight:600; font-size:18px; color:var(--navy); margin-bottom:8px;}
  .step p{font-size:14px; line-height:1.6; color:#4A4640;}

  /* Levels & Progress Sync */
  .levels{padding:64px 0; position:relative;}
  .levels-inner{max-width:680px; margin:0 auto;}
  .levels-layout{display:flex; gap:24px; align-items:stretch; max-width:calc(680px + 24px + 22px); margin:0 auto;}
  .levels-layout .levels-inner{margin:0; flex:1; min-width:0;}
  .xp-vertical{width:22px; flex-shrink:0; display:flex; flex-direction:column; gap:6px; padding-top:88px;}
  .vseg{flex:1; background:rgba(34,54,75,0.1); border-radius:4px; animation:segLight 10s infinite;}
  .vseg-1{animation-delay:0s;}
  .vseg-2{animation-delay:1.35s;}
  .vseg-3{animation-delay:3.15s;}
  .vseg-4{animation-delay:5.4s;}
  .vseg-5{animation-delay:8.1s;}
  @keyframes segLight{
    0%{background:rgba(34,54,75,0.1);}
    1%{background:var(--q-gold);}
    95%{background:var(--q-gold);}
    96%{background:rgba(34,54,75,0.1);}
    100%{background:rgba(34,54,75,0.1);}
  }
  @media (max-width:760px){ .levels-layout{flex-direction:column;} .xp-vertical{flex-direction:row-reverse; width:100%; height:16px; padding-top:0; margin-bottom:8px;} }

  .levels p.lead{font-size:15.5px; line-height:1.7; color:#4A4640; text-align:center; margin-bottom:32px;}
  .level-bar{display:flex; flex-direction:column; gap:10px; margin-bottom:36px;}

  .lvl{display:flex; align-items:center; gap:14px; background:var(--cream); border:1px solid rgba(34,54,75,0.08); border-radius:8px; padding:12px 18px; transition:transform .2s ease; position:relative;}
  .lvl:hover{transform:translateX(4px);}
  .lvl .xp{font-family:'Fraunces', serif; font-weight:700; font-size:13.5px; color:var(--q-gold-ink); background:var(--q-gold); padding:2px 9px; border-radius:6px; min-width:90px; text-align:center;}
  .lvl .lname{font-size:15px; font-weight:600; color:var(--navy);}

  /* Achievement Toasts neben den Leveln */
  .lvl-toast {
    position: absolute;
    left: calc(100% + 14px);
    top: 50%;
    transform: translateY(-50%) translateX(-10px);
    opacity: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--navy-deep);
    border: 1px solid var(--q-gold);
    border-radius: 10px;
    padding: 8px 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    pointer-events: none;
    z-index: 10;
  }
  .lvl-toast .ach-icon { font-size: 18px; }
  .lvl-toast .ach-label { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--q-gold); }
  .lvl-toast .ach-name { font-size: 12.5px; font-weight: 700; color: var(--cream); white-space: nowrap; }

  @keyframes toastPop {
    0% { opacity: 0; transform: translateY(-50%) translateX(-10px); }
    2% { opacity: 1; transform: translateY(-50%) translateX(0); }
    10% { opacity: 1; transform: translateY(-50%) translateX(0); }
    14% { opacity: 0; transform: translateY(-50%) translateX(10px); }
    100% { opacity: 0; transform: translateY(-50%) translateX(10px); }
  }
  @keyframes toastPopMobile {
    0% { opacity: 0; transform: translateY(10px); }
    2% { opacity: 1; transform: translateY(0); }
    10% { opacity: 1; transform: translateY(0); }
    14% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; transform: translateY(-10px); }
  }

  @media (max-width: 920px) {
    .lvl-toast {
      left: auto;
      right: 14px;
      top: auto;
      bottom: 100%;
      transform: translateY(10px);
    }
  }

  .lvl-1{animation:lvlPulse 10s infinite; animation-delay:0s;}
  .lvl-2{animation:lvlPulse 10s infinite; animation-delay:1.35s;}
  .lvl-3{animation:lvlPulse 10s infinite; animation-delay:3.15s;}
  .lvl-4{animation:lvlPulse 10s infinite; animation-delay:5.4s;}
  .lvl-5{animation:lvlPulse 10s infinite; animation-delay:8.1s;}

  .t-1{animation:toastPop 10s infinite; animation-delay:0s;}
  .t-2{animation:toastPop 10s infinite; animation-delay:1.35s;}
  .t-3{animation:toastPop 10s infinite; animation-delay:3.15s;}
  .t-4{animation:toastPop 10s infinite; animation-delay:5.4s;}
  .t-5{animation:toastPop 10s infinite; animation-delay:8.1s;}

  @media (max-width: 920px) {
    .t-1{animation-name:toastPopMobile;}
    .t-2{animation-name:toastPopMobile;}
    .t-3{animation-name:toastPopMobile;}
    .t-4{animation-name:toastPopMobile;}
    .t-5{animation-name:toastPopMobile;}
  }

  @keyframes lvlPulse{
    0%{background:var(--cream);}
    4%{background:rgba(245,197,24,0.35);}
    12%{background:var(--cream);}
    100%{background:var(--cream);}
  }

  @media (prefers-reduced-motion: reduce){
    .vseg{animation:none;}
    .vseg-1{background:var(--q-gold);}
    .lvl-1,.lvl-2,.lvl-3,.lvl-4,.lvl-5{animation:none;}
    .lvl-toast{display:none;}
  }

  .rewards{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:640px){ .rewards{grid-template-columns:1fr;} }
  .reward{background:var(--sand-card); border-radius:6px; padding:16px 18px;}
  .reward .rtitle{font-size:13px; font-weight:700; color:var(--sage-deep); margin-bottom:6px;}
  .reward p{font-size:14px; line-height:1.5; color:#4A4640;}

  .preview{padding:64px 0;}
  .quest-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}
  @media (max-width:820px){ .quest-grid{grid-template-columns:1fr; max-width:420px; margin:0 auto;} }

  .qcard{background:#fff; border:1px solid rgba(34,54,75,0.09); border-radius:16px; overflow:hidden; transition:transform .25s ease, box-shadow .25s ease; box-shadow:0 3px 12px rgba(34,54,75,0.06);}
  .qcard:hover{transform:translateY(-4px) rotate(0.4deg); box-shadow:0 18px 30px rgba(34,54,75,0.12);}

  .qtop{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:20px 20px 0;}
  .qribbon{position:relative; display:inline-block; background:var(--q-green); color:#fff; font-size:11px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; padding:7px 16px 7px 14px; clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%,7% 50%); transform:rotate(-1.5deg); box-shadow:0 3px 8px rgba(46,158,82,0.35);}
  .qtag.age{flex-shrink:0; background:var(--q-blue-deep); color:#fff; font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px; white-space:nowrap;}

  .qcard h3{font-family:'Work Sans', sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:0.01em; font-size:19px; color:var(--navy); margin:16px 20px 16px; line-height:1.25;}

  .qbox{border-radius:12px; padding:14px 16px 16px; margin:0 20px 12px;}
  .qbox-label{display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.07em; text-transform:uppercase; padding:4px 10px; border-radius:7px; margin-bottom:9px; color:#fff;}
  .qbox.auftrag{background:var(--q-gray-light);}
  .qbox.auftrag .qbox-label{background:var(--q-gray-deep);}
  .qbox.etappen{background:var(--q-blue-light);}
  .qbox.etappen .qbox-label{background:var(--q-blue-deep);}
  .qbox.finale{background:var(--q-green-light);}
  .qbox.finale .qbox-label{background:var(--q-green-deep);}

  .qauf{font-size:13.5px; line-height:1.5; color:#3A4348;}
  .qbox.finale p{font-size:13px; line-height:1.5; color:#2E4A34;}

  .qsteps{list-style:none;}
  .qsteps li{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; line-height:1.45; color:#2C4356; margin-bottom:7px;}
  .qsteps li:last-child{margin-bottom:0;}
  .qsteps .qsnum{flex-shrink:0; width:18px; height:18px; border-radius:5px; background:var(--q-blue-deep); color:#fff; font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px;}

  .qstats{display:flex; align-items:center; justify-content:space-between; padding:14px 20px 20px; border-top:1px dashed rgba(34,54,75,0.12); margin-top:4px;}
  .qduration{font-size:12px; font-weight:600; color:#6A6558; display:flex; align-items:center; gap:5px;}
  .qxp{background:var(--q-gold); color:var(--q-gold-ink); font-size:12.5px; font-weight:800; padding:6px 13px; border-radius:8px; letter-spacing:0.02em; transform:rotate(-1deg);}

  .ages{padding:16px 0 64px;}
  .ages-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
  @media (max-width:760px){ .ages-grid{grid-template-columns:1fr;} }
  .agecard{border-radius:10px; padding:28px 24px; color:var(--cream); transition:transform .25s ease;}
  .agecard:hover{transform:translateY(-3px);}
  .agecard:nth-child(1){background:var(--q-green);}
  .agecard:nth-child(2){background:var(--q-blue-deep);}
  .agecard:nth-child(3){background:var(--navy-deep);}
  .agecard .arange{font-family:'Fraunces', serif; font-weight:600; font-size:22px; margin-bottom:4px;}
  .agecard .alabel{font-size:12.5px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.75; margin-bottom:14px;}
  .agecard p{font-size:14px; line-height:1.6; opacity:0.92; margin-bottom:14px;}
  .agecard .acount{font-size:13px; font-weight:700; opacity:0.85;}

  .included{padding:64px 0;}
  .inc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
  @media (max-width:760px){ .inc-grid{grid-template-columns:1fr 1fr;} }
  .inc{background:var(--cream); border:1px solid rgba(34,54,75,0.08); border-radius:8px; padding:20px 18px;}
  .inc .mark{color:var(--sage-deep); font-weight:700; margin-bottom:8px; display:block;}
  .inc p{font-size:13.5px; line-height:1.5; color:#4A4640;}
  .inc p strong{color:var(--navy);}

  .pricing{background:var(--q-green-deep); color:var(--cream); padding:72px 28px; text-align:center;}
  .pricing-inner{max-width:560px; margin:0 auto;}
  .pricing h2{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(26px,3.6vw,34px); margin-bottom:10px;}
  .pricing .eyebrow2{font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(251,248,241,0.7); margin-bottom:18px;}
  .pricing > .pricing-inner > p.desc{font-size:15.5px; line-height:1.6; color:rgba(251,248,241,0.85); margin-bottom:28px;}
  .price-box{background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.22); border-radius:10px; padding:32px 28px; margin-bottom:20px;}
  .price-old{font-size:15px; text-decoration:line-through; color:rgba(251,248,241,0.55); margin-bottom:4px;}
  .price-new{font-family:'Fraunces', serif; font-weight:600; font-size:44px; margin-bottom:18px;}
  .secure{font-size:12.5px; color:rgba(251,248,241,0.6); margin-top:16px;}
  .print-note{display:inline-block; margin-top:14px; font-size:12.5px; font-weight:600; color:var(--q-gold-ink); background:var(--q-gold); padding:6px 14px; border-radius:8px;}
  .pricing .btn-primary{background:var(--q-gold); color:var(--q-gold-ink);}
  .pricing .btn-primary:hover{box-shadow:0 10px 24px rgba(245,197,24,0.4);}

  .faq{padding:72px 0;}
  .faq-list{max-width:680px; margin:36px auto 0;}
  details{background:var(--cream); border:1px solid rgba(34,54,75,0.08); border-radius:8px; margin-bottom:12px; padding:18px 22px;}
  summary{font-family:'Fraunces', serif; font-weight:600; font-size:16px; color:var(--navy); cursor:pointer; list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:'+'; float:right; color:var(--terracotta-deep); font-weight:700;}
  details[open] summary::after{content:'−';}
  details p{font-size:14.5px; line-height:1.65; color:#4A4640; margin-top:14px;}

  <footer>
  <div class="fname"><span class="cal" style="font-size:1.3em;">Calijula</span> Verlag</div>
